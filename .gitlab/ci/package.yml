package:build:
  extends: .skip-monitor-schedule
  stage: package
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_BUILDKIT: "1"
    DOCKER_TLS_CERTDIR: "/certs"
  dependencies: []
  before_script:
    - docker info
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - export IMAGE_REF="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker build --pull --tag "$IMAGE_REF" .
    - docker push "$IMAGE_REF"
    - printf 'IMAGE_REF=%s\n' "$IMAGE_REF" > package.env
    - export IMAGE_DIGEST_REF="$(docker image inspect --format='{{index .RepoDigests 0}}' "$IMAGE_REF")"
    - test -n "$IMAGE_DIGEST_REF"
    - printf 'IMAGE_DIGEST_REF=%s\n' "$IMAGE_DIGEST_REF" >> package.env
  artifacts:
    reports:
      dotenv: package.env
    paths:
      - package.env
    expire_in: 14 days
