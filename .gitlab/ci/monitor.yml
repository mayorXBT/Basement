monitor:synthetic:
  extends: .node-job
  stage: monitor
  variables:
    VERCEL_PRODUCTION_URL: https://basement.cefo.dev
  script:
    - mkdir -p reports
    - node scripts/monitor/synthetic.mjs "$VERCEL_PRODUCTION_URL" reports/monitor-synthetic.json
  artifacts:
    when: always
    paths:
      - reports/monitor-synthetic.json
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PIPELINE_KIND != "nightly-eval"'
