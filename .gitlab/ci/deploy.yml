.gcp-auth:
  image: google/cloud-sdk:slim
  id_tokens:
    GCP_ID_TOKEN:
      aud: https://iam.googleapis.com/projects/${GCP_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${GCP_WIF_POOL}/providers/${GCP_WIF_PROVIDER}
  before_script:
    - printf '%s' "$GCP_ID_TOKEN" > .ci_job_jwt
    - gcloud iam workload-identity-pools create-cred-config "projects/${GCP_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${GCP_WIF_POOL}/providers/${GCP_WIF_PROVIDER}" --service-account="$GCP_DEPLOY_SA" --credential-source-file=.ci_job_jwt --output-file=.gcp_cred.json
    - gcloud auth login --cred-file=.gcp_cred.json --quiet
    - gcloud config set project "$GCP_PROJECT_ID"

.gcp-deploy:
  extends: .gcp-auth
  before_script:
    - !reference [.gcp-auth, before_script]
    - apt-get update
    - apt-get install --yes --no-install-recommends nodejs

package:artifact-registry:
  extends: .gcp-auth
  stage: package
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs:
    - job: package:build
      artifacts: true
  before_script:
    - !reference [.gcp-auth, before_script]
    - apt-get update
    - apt-get install --yes --no-install-recommends docker.io
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
  script:
    - docker pull "$IMAGE_DIGEST_REF"
    - export AR_IMAGE_REF="$AR_REPO:$CI_COMMIT_SHA"
    - docker tag "$IMAGE_DIGEST_REF" "$AR_IMAGE_REF"
    - docker push "$AR_IMAGE_REF"
    - export IMAGE_DIGEST_REF="$(docker image inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$AR_IMAGE_REF" | grep -F "${AR_REPO}@" | head -n 1)"
    - test -n "$IMAGE_DIGEST_REF"
    - printf 'IMAGE_DIGEST_REF=%s\n' "$IMAGE_DIGEST_REF" > artifact-registry.env
  artifacts:
    reports:
      dotenv: artifact-registry.env
    paths:
      - artifact-registry.env
    expire_in: 14 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PIPELINE_KIND == "monitor"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true

deploy:review:
  extends: .gcp-deploy
  stage: review
  needs:
    - job: package:artifact-registry
      artifacts: true
  environment:
    name: review/$CI_MERGE_REQUEST_IID
    url: $DEPLOY_URL
    auto_stop_in: 1 day
  script:
    - export DEPLOY_TAG="mr-${CI_MERGE_REQUEST_IID}"
    - export DEPLOY_URL="$(scripts/deploy/cloudrun.sh "$CLOUD_RUN_SERVICE_STAGING" "$DEPLOY_TAG")"
    - printf 'DEPLOY_URL=%s\nDEPLOY_TAG=%s\n' "$DEPLOY_URL" "$DEPLOY_TAG" > deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PIPELINE_KIND == "monitor"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true

smoke:review:
  extends: .gcp-deploy
  stage: review
  needs:
    - job: deploy:review
      artifacts: true
  script:
    - export CLOUD_RUN_ID_TOKEN="$(gcloud auth print-identity-token --audiences="$DEPLOY_URL")"
    - node scripts/monitor/smoke.mjs "$DEPLOY_URL"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PIPELINE_KIND == "monitor"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true

deploy:staging:
  extends: .gcp-deploy
  stage: staging
  needs:
    - job: package:artifact-registry
      artifacts: true
  environment:
    name: staging
    url: $DEPLOY_URL
  script:
    - export DEPLOY_TAG="staging-${CI_PIPELINE_ID}"
    - export DEPLOY_URL="$(scripts/deploy/cloudrun.sh "$CLOUD_RUN_SERVICE_STAGING" "$DEPLOY_TAG")"
    - printf 'DEPLOY_URL=%s\nDEPLOY_TAG=%s\nIMAGE_DIGEST_REF=%s\n' "$DEPLOY_URL" "$DEPLOY_TAG" "$IMAGE_DIGEST_REF" > deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PIPELINE_KIND == "monitor"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $AUTOPILOT_MODE == "handsoff" && $GCP_DEPLOY_APPROVED == "1" && $AUTOPILOT_PAUSED != "1"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $AUTOPILOT_PAUSED != "1"'
      when: manual

smoke:staging:
  extends: .gcp-deploy
  stage: staging
  needs:
    - job: deploy:staging
      artifacts: true
  environment:
    name: staging
    url: $DEPLOY_URL
  script:
    - export CLOUD_RUN_ID_TOKEN="$(gcloud auth print-identity-token --audiences="$DEPLOY_URL")"
    - node scripts/monitor/smoke.mjs "$DEPLOY_URL"
    - scripts/deploy/promote.sh "$CLOUD_RUN_SERVICE_STAGING" "$DEPLOY_TAG"
    - printf 'DEPLOY_URL=%s\nIMAGE_DIGEST_REF=%s\n' "$DEPLOY_URL" "$IMAGE_DIGEST_REF" > smoke.env
  artifacts:
    reports:
      dotenv: smoke.env
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PIPELINE_KIND == "monitor"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $AUTOPILOT_PAUSED != "1"'

deploy:prod:
  extends: .gcp-deploy
  stage: production
  needs:
    - job: smoke:staging
      artifacts: true
    - job: govern:policy
      artifacts: true
  environment:
    name: production
    url: $DEPLOY_URL
  script:
    - export DEPLOY_TAG="candidate-${CI_PIPELINE_ID}"
    - export DEPLOY_URL="$(scripts/deploy/cloudrun.sh "$CLOUD_RUN_SERVICE_PROD" "$DEPLOY_TAG")"
    - printf 'DEPLOY_URL=%s\nDEPLOY_TAG=%s\n' "$DEPLOY_URL" "$DEPLOY_TAG" > deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PIPELINE_KIND == "monitor"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $AUTOPILOT_MODE == "handsoff" && $GCP_DEPLOY_APPROVED == "1" && $AUTOPILOT_PAUSED != "1"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $AUTOPILOT_PAUSED != "1"'
      when: manual

smoke:candidate:
  extends: .gcp-deploy
  stage: production
  needs:
    - job: deploy:prod
      artifacts: true
  environment:
    name: production
    url: $DEPLOY_URL
  script:
    - export CLOUD_RUN_ID_TOKEN="$(gcloud auth print-identity-token --audiences="$DEPLOY_URL")"
    - node scripts/monitor/smoke.mjs "$DEPLOY_URL"
    - scripts/deploy/promote.sh "$CLOUD_RUN_SERVICE_PROD" "$DEPLOY_TAG"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PIPELINE_KIND == "monitor"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $AUTOPILOT_PAUSED != "1"'
