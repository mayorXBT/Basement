deploy:vercel:
  extends: .node-job
  stage: production
  variables:
    VERCEL_PRODUCTION_URL: https://basement.cefo.dev
    SMOKE_EXPECT_PROVIDERS: "0"
  environment:
    name: production
    url: https://basement.cefo.dev
  script:
    - echo "Checking existing Vercel production target at $VERCEL_PRODUCTION_URL"
    - node scripts/monitor/smoke.mjs "$VERCEL_PRODUCTION_URL"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PIPELINE_KIND == "monitor"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
