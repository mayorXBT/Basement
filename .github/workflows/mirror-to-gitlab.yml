name: Mirror gitlab-autopilot to GitLab

on:
  push:
    branches:
      - gitlab-autopilot
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-gitlab-autopilot
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push branch to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          test -n "$GITLAB_TOKEN"
          git -c credential.helper='!f() { test "$1" = get || exit 0; printf "%s\n" "username=oauth2" "password=$GITLAB_TOKEN"; }; f' \
            push https://gitlab.com/gitlab-ai-hackathon/transcend-october-2026/43556545/showcase.git \
            HEAD:refs/heads/gitlab-autopilot

      - name: Ensure GitLab merge request is open
        if: github.event_name == 'push'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          api="https://gitlab.com/api/v4/projects/87881108/merge_requests"
          response="$RUNNER_TEMP/gitlab-merge-requests.json"
          curl --fail --silent --show-error \
            --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            "$api?state=opened&source_branch=gitlab-autopilot&target_branch=main" \
            --output "$response"

          if [ "$(node -e 'const fs=require("fs");const rows=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(String(rows.length))' "$response")" != "0" ]; then
            node -e 'const fs=require("fs");const rows=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));console.log(`GitLab merge request already open: ${rows[0].web_url}`)' "$response"
            exit 0
          fi

          # Title and description come from the pushed commit, so a "Closes #<iid>" line in its
          # body is on the MR from the start; govern:evidence needs it after auto-merge.
          title="$(git log -1 --pretty=%s)"
          description="$RUNNER_TEMP/gitlab-merge-request-description.md"
          git log -1 --pretty=%b > "$description"
          curl --fail --silent --show-error \
            --request POST \
            --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            --data-urlencode "source_branch=gitlab-autopilot" \
            --data-urlencode "target_branch=main" \
            --data-urlencode "title=$title" \
            --data-urlencode "description@$description" \
            --data-urlencode "remove_source_branch=false" \
            "$api" \
            --output "$response"
          node -e 'const fs=require("fs");const row=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));console.log(`Opened GitLab merge request: ${row.web_url}`)' "$response"

      - name: Arm explicitly requested GitLab merge
        if: github.event_name == 'push'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          iid="$(git log -1 --pretty=%B | sed -n 's/^GitLab-Auto-Merge: \([0-9][0-9]*\)$/\1/p' | tail -n 1)"
          if [ -z "$iid" ]; then
            echo "No GitLab merge was requested by this commit."
            exit 0
          fi

          response="$RUNNER_TEMP/gitlab-merge.json"
          mr_api="https://gitlab.com/api/v4/projects/87881108/merge_requests/$iid"
          head_sha="$(git rev-parse HEAD)"
          for attempt in $(seq 1 24); do
            curl --fail --silent --show-error \
              --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              "$mr_api" \
              --output "$response"
            ready="$(node -e 'const fs=require("fs");const row=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(String(row.sha===process.argv[2] && Boolean(row.head_pipeline?.id)))' "$response" "$head_sha")"
            if [ "$ready" = "true" ]; then
              break
            fi
            if [ "$attempt" = "24" ]; then
              echo "GitLab MR !$iid did not expose a pipeline for the mirrored head within 120 seconds."
              exit 1
            fi
            echo "Waiting for GitLab MR !$iid head pipeline ($attempt/24)."
            sleep 5
          done

          curl --fail --silent --show-error \
            --request PUT \
            --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            --data-urlencode "auto_merge=true" \
            --data-urlencode "should_remove_source_branch=false" \
            --data-urlencode "sha=$head_sha" \
            "$mr_api/merge" \
            --output "$response"
          node -e 'const fs=require("fs");const row=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));console.log(`GitLab merge requested: ${row.web_url}`)' "$response"
