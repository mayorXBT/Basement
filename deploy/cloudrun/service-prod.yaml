apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: basement
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: basement-runtime@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: europe-west1-docker.pkg.dev/PROJECT_ID/basement/basement@sha256:REPLACE_WITH_DIGEST
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: TRUST_PROXY
              value: "1"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef: { name: gemini-api-key, key: latest }
            - name: DEEPGRAM_API_KEY
              valueFrom:
                secretKeyRef: { name: deepgram-api-key, key: latest }
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef: { name: groq-api-key, key: latest }
