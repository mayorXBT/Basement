include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml
    inputs:
      stage: secure
      allow_failure: false
  - local: .gitlab/ci/verify.yml
  - local: .gitlab/ci/secure.yml
  - local: .gitlab/ci/package.yml
  - local: .gitlab/ci/deploy.yml
  - local: .gitlab/ci/agents.yml
  - local: .gitlab/ci/release.yml
  - local: .gitlab/ci/govern.yml
  - local: .gitlab/ci/monitor.yml

stages:
  - .pre
  - verify
  - secure
  - package
  - release
  - production
  - monitor
  - govern
  - .post

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PIPELINE_KIND != "nightly-eval"'
      variables:
        SAST_DISABLED: "true"
        SECRET_DETECTION_DISABLED: "true"
        DEPENDENCY_SCANNING_DISABLED: "true"
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "gitlab-autopilot"'

default:
  interruptible: true

.skip-monitor-schedule:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PIPELINE_KIND != "nightly-eval"'
      when: never
    - when: on_success

variables:
  AUTOPILOT_MODE: supervised
  AST_ENABLE_MR_PIPELINES: "true"
